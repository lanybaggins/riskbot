services:
  riskbot-dev:
    build:
      context: ../
      dockerfile: Dockerfile
      args: { NODE_ENV: production }
    image: riskbot:latest
    restart: unless-stopped
    read_only: true
    tmpfs: [ "/tmp" ]
  restarter-dev:
    image: docker:cli
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: ["/bin/sh", "-c", "while true; do sleep 86400; docker restart riskbot-riskbot-dev-1; done"]
    restart: unless-stopped
